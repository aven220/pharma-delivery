# Producción empresarial — A-AS Delivery
# Uso: cp .env.production.example .env.production && docker compose -f docker-compose.prod.yml --env-file .env.production up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: pharma-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pharma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-pharma_delivery}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-pharma} -d ${POSTGRES_DB:-pharma_delivery}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pharma-net

  redis:
    image: redis:7-alpine
    container_name: pharma-redis-prod
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pharma-net

  backend-1:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: pharma-backend-1
    restart: unless-stopped
    environment: &backend-env
      NODE_ENV: production
      INSTANCE_ID: backend-1
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-pharma}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pharma_delivery}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      UPLOAD_DIR: /app/uploads
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_DIR: /app/logs
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
    volumes:
      - uploads_data:/app/uploads
      - backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:4000/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - pharma-net

  backend-2:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: pharma-backend-2
    restart: unless-stopped
    environment:
      <<: *backend-env
      INSTANCE_ID: backend-2
    volumes:
      - uploads_data:/app/uploads
      - backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:4000/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - pharma-net

  nginx:
    image: nginx:alpine
    container_name: pharma-nginx-prod
    restart: unless-stopped
    ports:
      - '${PUBLIC_PORT:-8080}:80'
    volumes:
      - ./infra/nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend-1
      - backend-2
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost/health']
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - pharma-net

  web-admin:
    build:
      context: .
      dockerfile: apps/web-admin/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    container_name: pharma-web-admin-prod
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-8081}:80'
    depends_on:
      - nginx
    networks:
      - pharma-net

  backup:
    build:
      context: .
      dockerfile: ops/backup/Dockerfile
    container_name: pharma-backup-prod
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-pharma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-pharma_delivery}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - postgres_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pharma-net

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  backend_logs:
  postgres_backups:

networks:
  pharma-net:
    driver: bridge
